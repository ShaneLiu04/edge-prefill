# AR007 canonical point: length-adaptive budget (planner reads the measured
# curve; no explicit budget here so the curve wins). Pair against dense-ref.
# Regenerate the curve with benchmarks/scripts/sweep_budget.py; the file
# records the model fingerprint and is ignored when it does not match.
mode = balanced
attn_top_k = 24
pool_branches = false
query_gating = false
qg_bound = false
embedding_model =
anchor_ratio = 0.35
budget_curve = benchmarks/results/ar007-sweep/budget_curve.txt
threads = 16
warmup = 1
max_new_tokens = 16
repeats = 3
