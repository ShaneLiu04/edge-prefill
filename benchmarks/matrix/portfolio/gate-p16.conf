# AR008 combination arm: in-graph page gate, 16 pages, ubatch-span local
# window. Quality-first arm for prompts where selection-level admission is
# measured to miss the floor (see benchmarks/results/ar008-portfolio/matrix.md).
mode = balanced
budget = 0.25
attn_top_k = 24
pool_branches = false
query_gating = false
qg_bound = true
qg_sel_pages = 16
qg_local_rows = 0
embedding_model =
anchor_ratio = 0.35
phrase_weight = 0.5
threads = 16
warmup = 1
max_new_tokens = 16
repeats = 3
