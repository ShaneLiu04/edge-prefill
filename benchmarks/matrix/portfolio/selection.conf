# AR008 canonical combination: selection-level sparsity with the measured
# budget curve and phrase-aware admission. This is the default arm and the
# fastest one on every measured dataset whose quality floor is met.
mode = balanced
budget_curve = benchmarks/results/ar007-sweep/budget_curve.txt
attn_top_k = 24
pool_branches = false
query_gating = false
qg_bound = false
embedding_model =
anchor_ratio = 0.35
phrase_weight = 0.5
threads = 16
warmup = 1
max_new_tokens = 16
repeats = 3
