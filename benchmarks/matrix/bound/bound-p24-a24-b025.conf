# AR006 canonical point: in-graph query-aware page gating, 24 pages/ubatch.
# Slightly more pages than p16: costs one extra gather slice but keeps the
# 16K/32K needle margin. Pair against dense-ref.conf (same machine/session).
mode = balanced
budget = 0.25
attn_top_k = 24
pool_branches = false
query_gating = false
qg_bound = true
qg_sel_pages = 24
qg_local_rows = 0
qg_pool_pages = 0
embedding_model =
threads = 16
warmup = 1
max_new_tokens = 16
repeats = 5
