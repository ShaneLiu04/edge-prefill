# AR006 canonical point: in-graph query-aware page gating, 16 pages/ubatch.
# Machine paths (model / data_dir) are injected on the command line.
# Pair against dense-ref.conf measured on the same machine and session.
mode = balanced
budget = 0.25
attn_top_k = 24
pool_branches = false
query_gating = false
qg_bound = true
qg_sel_pages = 16
qg_local_rows = 0
qg_pool_pages = 0
embedding_model =
threads = 16
warmup = 1
max_new_tokens = 16
repeats = 5
