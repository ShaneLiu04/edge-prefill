<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="EdgePrefill AR013 cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#0D1728"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="0.62" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0EA5A0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#E6FFFB"/>
      <stop offset="1" stop-color="#99F6E4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pageGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.055"/>
    </pattern>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#2DD4BF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="1150" cy="80" rx="460" ry="320" fill="url(#glowTeal)" opacity="0.45"/>
  <ellipse cx="170" cy="640" rx="520" ry="280" fill="url(#glowIndigo)" opacity="0.32"/>
  <rect width="1280" height="640" fill="url(#pageGrid)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#topLine)"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif">
    <g filter="url(#textGlow)">
      <rect x="80" y="72" width="44" height="44" rx="12" fill="url(#mark)"/>
      <rect x="92" y="82" width="20" height="4.5" rx="2.25" fill="#042F2E"/>
      <rect x="92" y="91.75" width="13" height="4.5" rx="2.25" fill="#042F2E"/>
      <rect x="92" y="101.5" width="20" height="4.5" rx="2.25" fill="#042F2E"/>
      <rect x="92" y="82" width="4.5" height="24" rx="2.25" fill="#042F2E"/>
    </g>

    <text x="142" y="102" font-size="12.5" font-weight="600" letter-spacing="2.6" fill="#5EEAD4">EDGE INFERENCE / AR013 ST ACCEPTED</text>

    <text x="78" y="228" font-size="92" font-weight="700" letter-spacing="-2.5" fill="url(#titleGrad)">EdgePrefill</text>
    <rect x="80" y="250" width="120" height="4" rx="2" fill="url(#accent)"/>

    <text x="80" y="305" font-size="24" font-weight="500" fill="#E2E8F0">面向端侧长上下文的分层稀疏 Prefill 引擎</text>

    <text x="80" y="350" font-size="15" fill="#94A3B8">Compact context: KV sized by the admitted span, and 64K</text>
    <text x="80" y="373" font-size="15" fill="#94A3B8">documents on a 32K-trained model.</text>

    <text x="80" y="440" font-size="28" font-weight="700" fill="#F8FAFC">896 -&gt; 7</text>
    <text x="80" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">MiB / 4K KV</text>

    <text x="280" y="440" font-size="30" font-weight="700" fill="#F8FAFC">64K</text>
    <text x="280" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">DOC / 32K MODEL</text>

    <text x="430" y="440" font-size="30" font-weight="700" fill="#F8FAFC">0.975</text>
    <text x="430" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">MULTI-FACT Q</text>

    <text x="585" y="440" font-size="30" font-weight="700" fill="#F8FAFC">0.96x</text>
    <text x="585" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">TTFT / AR012</text>

    <text x="80" y="484" font-size="10" letter-spacing="0.8" fill="#475569">OLD BENCH 896 MiB / AR012 112 MiB / AR013 7 MiB AT 4K</text>

    <rect x="80" y="502" width="680" height="1" fill="#1E293B"/>
    <text x="80" y="536" font-size="12.5" letter-spacing="1.4" fill="#64748B">C++17 / CMAKE / LLAMA.CPP 3BB63CBC / AR001-AR013</text>
    <text x="80" y="558" font-size="11" letter-spacing="0.8" fill="#475569">209 TESTS / 22 GATES / 40-192x vs dense / q = NIAH accuracy</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="780" y="96" width="420" height="448" rx="24" fill="#0B1424" fill-opacity="0.9" stroke="#1E293B"/>
    <rect x="780.5" y="96.5" width="419" height="447" rx="23.5" fill="none" stroke="#2DD4BF" stroke-opacity="0.08"/>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif">
    <text x="818" y="137" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#5EEAD4">COMPACT CONTEXT</text>
    <text x="818" y="160" font-size="10.5" letter-spacing="1.2" fill="#64748B">KV SIZED BY THE ADMITTED SPAN</text>
    <rect x="818" y="174" width="344" height="1" fill="#1E293B"/>

    <text x="818" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569">DATASET</text>
    <text x="970" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569" text-anchor="end">KV MiB</text>
    <text x="1035" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569" text-anchor="end">Q</text>
    <text x="1162" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569" text-anchor="end">TTFT ms</text>

    <text x="818" y="229" font-size="12" font-weight="600" fill="#E2E8F0">4K</text>
    <text x="970" y="230" font-size="10" fill="#94A3B8" text-anchor="end">112 -&gt; 7</text>
    <text x="1035" y="230" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>
    <text x="1162" y="230" font-size="10" fill="#94A3B8" text-anchor="end">3311 -&gt; 2163</text>

    <text x="818" y="261" font-size="12" font-weight="600" fill="#E2E8F0">8K</text>
    <text x="970" y="262" font-size="10" fill="#94A3B8" text-anchor="end">217 -&gt; 7</text>
    <text x="1035" y="262" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>
    <text x="1162" y="262" font-size="10" fill="#94A3B8" text-anchor="end">1131 -&gt; 1100</text>

    <text x="818" y="293" font-size="12" font-weight="600" fill="#E2E8F0">16K</text>
    <text x="970" y="294" font-size="10" fill="#94A3B8" text-anchor="end">430 -&gt; 14</text>
    <text x="1035" y="294" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>
    <text x="1162" y="294" font-size="10" fill="#94A3B8" text-anchor="end">1641 -&gt; 1789</text>

    <rect x="810" y="307" width="352" height="28" rx="8" fill="#14B8A6" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.18"/>
    <text x="818" y="325" font-size="12" font-weight="600" fill="#F8FAFC">32K</text>
    <text x="970" y="326" font-size="10" fill="#94A3B8" text-anchor="end">854 -&gt; 21</text>
    <text x="1035" y="326" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>
    <text x="1162" y="326" font-size="10" fill="#94A3B8" text-anchor="end">2980 -&gt; 3073</text>

    <text x="818" y="357" font-size="12" font-weight="600" fill="#E2E8F0">64K</text>
    <text x="970" y="358" font-size="10" fill="#5EEAD4" text-anchor="end">- -&gt; 35</text>
    <text x="1035" y="358" font-size="10" fill="#5EEAD4" text-anchor="end">1.00</text>
    <text x="1162" y="358" font-size="10" fill="#5EEAD4" text-anchor="end">6436</text>

    <text x="818" y="386" font-size="9" letter-spacing="0.4" fill="#94A3B8">32K-trained model; 64K document enabled by position compaction</text>

    <rect x="818" y="404" width="344" height="76" rx="10" fill="#082F2E" stroke="#14B8A6" stroke-opacity="0.35"/>
    <text x="832" y="424" font-size="10" letter-spacing="1.1" font-weight="700" fill="#5EEAD4">MULTI-FACT / KV</text>
    <text x="832" y="442" font-size="9.5" letter-spacing="0.4" fill="#E2E8F0">q 0.887 -&gt; 0.975 / hard 0.739 -&gt; 0.746</text>
    <text x="832" y="457" font-size="9.5" letter-spacing="0.4" fill="#E2E8F0">TTFT 0.96x aggregate / 40-192x vs dense</text>
    <text x="832" y="472" font-size="8.5" letter-spacing="0.4" fill="#94A3B8">position compaction / ensure_context</text>

    <text x="818" y="500" font-size="9" letter-spacing="1" fill="#64748B">KV: OLD BENCH 896 -&gt; AR013 7-21 MiB</text>
    <text x="818" y="526" font-size="9" letter-spacing="1.1" fill="#64748B">AR013 / 209 TESTS / 22 GATES</text>
    <text x="1162" y="526" font-size="9" letter-spacing="1.1" fill="#64748B" text-anchor="end">AR013 ST</text>
  </g>
</svg>
