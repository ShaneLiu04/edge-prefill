    <text x="142" y="102" font-size="12.5" font-weight="600" letter-spacing="2.6" fill="#5EEAD4">EDGE INFERENCE / AR011 ST ACCEPTED</text>

    <text x="78" y="228" font-size="92" font-weight="700" letter-spacing="-2.5" fill="url(#titleGrad)">EdgePrefill</text>
    <rect x="80" y="250" width="120" height="4" rx="2" fill="url(#accent)"/>

    <text x="80" y="305" font-size="24" font-weight="500" fill="#E2E8F0">面向端侧长上下文的分层稀疏 Prefill 引擎</text>

    <text x="80" y="350" font-size="15" fill="#94A3B8">Evidence-first, structure-bounded admission with 40-192x</text>
    <text x="80" y="373" font-size="15" fill="#94A3B8">CPU prefill speedups on a pinned llama.cpp backend.</text>

    <text x="80" y="440" font-size="30" font-weight="700" fill="#F8FAFC">40.4x</text>
    <text x="80" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">4K CPU</text>

    <text x="215" y="440" font-size="30" font-weight="700" fill="#F8FAFC">67.8x</text>
    <text x="215" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">8K CPU</text>

    <text x="350" y="440" font-size="30" font-weight="700" fill="#F8FAFC">124.5x</text>
    <text x="350" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">16K CPU</text>

    <text x="505" y="440" font-size="30" font-weight="700" fill="#F8FAFC">~192x</text>
    <text x="505" y="462" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#64748B">32K CPU</text>

    <text x="80" y="484" font-size="10" letter-spacing="0.8" fill="#475569">SINGLE-FACT Q = 1.00 / 7 DATASETS ROUTED TO AR011</text>

    <rect x="80" y="502" width="680" height="1" fill="#1E293B"/>
    <text x="80" y="536" font-size="12.5" letter-spacing="1.4" fill="#64748B">C++17 / CMAKE / LLAMA.CPP 3BB63CBC / AR001-AR011</text>
    <text x="80" y="558" font-size="11" letter-spacing="0.8" fill="#475569">GPU 8K 24x / multi-fact hard q_min 0.087 -&gt; 0.571 / q = NIAH accuracy</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="780" y="96" width="420" height="448" rx="24" fill="#0B1424" fill-opacity="0.9" stroke="#1E293B"/>
