    <text x="818" y="160" font-size="10.5" letter-spacing="1.2" fill="#64748B">7/7 ROUTED / SINGLE-FACT Q=1.00</text>
    <rect x="818" y="174" width="344" height="1" fill="#1E293B"/>

    <text x="818" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569">DATASET</text>
    <text x="1015" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569" text-anchor="end">SPEEDUP</text>
    <text x="1100" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569" text-anchor="end">TOKENS</text>
    <text x="1162" y="196" font-size="8.5" letter-spacing="1.2" fill="#475569" text-anchor="end">Q</text>

    <text x="818" y="229" font-size="12" font-weight="600" fill="#E2E8F0">4K</text>
    <text x="1015" y="231" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="end">40.4x</text>
    <text x="1100" y="230" font-size="10" fill="#94A3B8" text-anchor="end">146</text>
    <text x="1162" y="230" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>

    <text x="818" y="261" font-size="12" font-weight="600" fill="#E2E8F0">8K</text>
    <text x="1015" y="263" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="end">67.8x</text>
    <text x="1100" y="262" font-size="10" fill="#94A3B8" text-anchor="end">188</text>
    <text x="1162" y="262" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>

    <text x="818" y="293" font-size="12" font-weight="600" fill="#E2E8F0">16K</text>
    <text x="1015" y="295" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="end">124.5x</text>
    <text x="1100" y="294" font-size="10" fill="#94A3B8" text-anchor="end">280</text>
    <text x="1162" y="294" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>

    <rect x="810" y="307" width="352" height="28" rx="8" fill="#14B8A6" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.18"/>
