    <text x="1015" y="327" font-size="18" font-weight="700" fill="#5EEAD4" text-anchor="end">~192x</text>
    <text x="1100" y="326" font-size="10" fill="#94A3B8" text-anchor="end">525</text>
    <text x="1162" y="326" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>

    <text x="818" y="357" font-size="12" font-weight="600" fill="#E2E8F0">MN 8K</text>
    <text x="1015" y="359" font-size="18" font-weight="700" fill="#F8FAFC" text-anchor="end">59.4x</text>
    <text x="1100" y="358" font-size="10" fill="#94A3B8" text-anchor="end">247</text>
    <text x="1162" y="358" font-size="10" fill="#94A3B8" text-anchor="end">1.00</text>

    <text x="818" y="386" font-size="9" letter-spacing="0.4" fill="#94A3B8">32K dense is a 2-case subset; ~192x vs 447 s</text>

    <rect x="818" y="404" width="344" height="76" rx="10" fill="#082F2E" stroke="#14B8A6" stroke-opacity="0.35"/>
    <text x="832" y="424" font-size="10" letter-spacing="1.1" font-weight="700" fill="#5EEAD4">STRUCTURE vs EVIDENCE</text>
    <text x="832" y="442" font-size="9.5" letter-spacing="0.4" fill="#E2E8F0">4K -35% / 8K -18% / multi-needle -23% tokens</text>
    <text x="832" y="457" font-size="9.5" letter-spacing="0.4" fill="#E2E8F0">multi-fact hard q_min 0.087 -&gt; 0.571</text>
    <text x="832" y="472" font-size="8.5" letter-spacing="0.4" fill="#94A3B8">embedding zero-gain / coverage_reserve off</text>

    <text x="818" y="500" font-size="9" letter-spacing="1" fill="#64748B">AR011 VS AR010: QUALITY NO WORSE / TOKENS LOWER</text>
    <text x="818" y="526" font-size="9" letter-spacing="1.1" fill="#64748B">AR011 T014 / 7 DATASETS / ALL ROUTED</text>
    <text x="1162" y="526" font-size="9" letter-spacing="1.1" fill="#64748B" text-anchor="end">AR011 ST</text>
