<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="EdgePrefill AR011 cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#0D1728"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="0.62" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
